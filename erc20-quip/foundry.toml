[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Quip / Aglais testnet (chain id 20033). Verified by curl eth_chainId.
[rpc_endpoints]
agls = "https://evm-rpc.aglais.quip.network:20049"

[etherscan]
# Blockscout-based, no API key required.
agls = {key = "", url = "https://explorer.aglais.quip.network/api", chain = 20033}

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"