<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TipJar</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    input, button { font: inherit; padding: .4rem; margin: .2rem 0; width: 100%; box-sizing: border-box; }
    button { width: auto; }
    li { margin: .3rem 0; font-size: .9rem; word-break: break-all; }
    #status { color: #555; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>TipJar — Quip Aglais testnet</h1>
  <button id="connect">Connect injected EVM wallet</button>
  <button id="connect-pq">Use local Quip PQ account</button>
  <p id="account"></p>
  <small>Local PQ mode needs <code>node scripts/serve.mjs</code> running on this machine with throwaway keys in <code>./keys</code>. It uses a testnet-only Quip-SHRINCS demo account, not the official Quip Account extension. Never expose this signer server to the internet.</small>
  <h2>Send a tip</h2>
  <input id="creator" placeholder="Creator address (0x...)" />
  <input id="eth" placeholder="AGLS amount, e.g. 0.001" />
  <input id="token" placeholder="ERC-20 address (optional)" />
  <input id="tokenAmount" placeholder="Token amount (optional)" />
  <input id="message" placeholder="Message" />
  <button id="tip">Tip</button>
  <p id="status"></p>
  <h2>Recent tips</h2>
  <ul id="tips"></ul>
  <script type="module" src="app.js"></script>
</body>
</html>
