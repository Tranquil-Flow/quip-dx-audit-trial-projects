[package]
name = "quip-pq-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Demo: Quip Network SHRINCS post-quantum (hash-based) sign/verify/tamper CLI"

[dependencies]
hashsigs-rs = { version = "=0.2.1-rc9" }
# message digest -> the 32-byte hash SHRINCS signs (crate is hash-agnostic here)
sha2 = "0.10"
# fresh keypair seed (the hashsigs-rs library has NO RNG by design)
getrandom = "0.2"
hex = "0.4"

[profile.release]
# sig verify is hash-heavy; keep defaults but tag profile
debug = false
