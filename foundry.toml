[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
gas_limit = "18446744073709551615"  # u64::MAX like the upstream repo
fs_permissions = [
    { access = "read", path = "./lib/hashsigs-solidity/test/test_vectors/" },
    { access = "read", path = "./keys/" },
]

[rpc_endpoints]
aglais = "https://evm-rpc.aglais.quip.network:20049"
