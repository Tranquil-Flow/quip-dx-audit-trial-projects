[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "hashsigs/=lib/hashsigs-solidity/contracts/",
]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
aglais = "https://evm-rpc.aglais.quip.network:20049"
