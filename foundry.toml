[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
gas_limit = "18446744073709551615" # u64::MAX (upstream hashsigs-solidity does the same; verify() is hash-chain heavy)

# the test reads vectors generated by the off-chain TypeScript signer
fs_permissions = [{ access = "read", path = "./test/testvectors/" }]
via_ir = false

[profile.production]
via_ir = true
optimizer = true
optimizer_runs = 1000000
no_console = true

[fmt]
line_length = 120
